[project]
name = "production-rag-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dhool143", email = "fathiyayoosef@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.162.0",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
production-rag-pipeline = "production_rag_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "production-rag-pipeline",
]
